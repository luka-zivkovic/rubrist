name: Release containers

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PG_SMOKE_DATABASE_URL: postgres://rubrist:rubrist@localhost:5432/rubrist
      BETTER_AUTH_SECRET: release-test-secret-for-postgres-suite-at-least-32-bytes
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: rubrist
          POSTGRES_PASSWORD: rubrist
          POSTGRES_DB: rubrist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rubrist -d rubrist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package_version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v${package_version}"

      - name: Validate self-host release bundle
        shell: bash
        env:
          RUBRIST_VERSION: 0.0.0
          RUBRIST_POSTGRES_PASSWORD: release-render-password
          RUBRIST_AUTH_SECRET: release-render-auth-secret-at-least-32-bytes
        run: |
          (cd deploy/self-host && sha256sum -c compose.yaml.sha256 compose.sqlite.yaml.sha256)
          docker compose -f deploy/self-host/compose.yaml config --quiet
          docker compose -f deploy/self-host/compose.sqlite.yaml config --quiet

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Guard shared contracts and repository boundaries
        run: |
          pnpm shared-contracts
          pnpm repository-boundaries

      - name: Test
        run: pnpm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite a published release tag
        shell: bash
        run: |
          image="ghcr.io/${{ github.repository_owner }}/rubrist-${{ matrix.image }}:${{ steps.version.outputs.value }}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image tag: $image" >&2
            exit 1
          fi

      - name: Build and publish immutable release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rubrist-${{ matrix.image }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/rubrist-${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  smoke-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Verify both published installation templates and SQLite restore
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          version="${RELEASE_TAG#v}"
          api="ghcr.io/${IMAGE_OWNER}/rubrist-api:${version}"
          web="ghcr.io/${IMAGE_OWNER}/rubrist-web:${version}"
          node tools/ci/release-template-images.mjs
          docker pull "$api"
          docker pull "$web"
          node tools/ci/postgres-deployment.mjs "$api" "$web"
          node tools/ci/sqlite-deployment.mjs "$api" "$web"

  draft-release:
    needs: smoke-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Create operator-reviewed draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          deploy/self-host/compose.yaml
          deploy/self-host/compose.yaml.sha256
          deploy/self-host/compose.sqlite.yaml
          deploy/self-host/compose.sqlite.yaml.sha256
          deploy/coolify.yaml
          deploy/coolify.sqlite.yaml
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --draft
          --generate-notes
          --title "$GITHUB_REF_NAME"
