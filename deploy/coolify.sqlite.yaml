# documentation: https://github.com/luka-zivkovic/rubrist/blob/main/docs/self-hosting.md
# slogan: Governed evaluators and verifiable assessment evidence for AI systems.
# category: ai
# tags: ai,evaluation,llm,governance,observability
# logo: svgs/rubrist.svg
# port: 80

services:
  web:
    image: ghcr.io/luka-zivkovic/rubrist-web:${RUBRIST_VERSION:?}
    environment:
      - SERVICE_URL_WEB_80
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: ghcr.io/luka-zivkovic/rubrist-api:${RUBRIST_VERSION:?}
    environment:
      PORT: "8787"
      RUBRIST_STORAGE: sqlite
      RUBRIST_REQUIRE_PERSISTENT_MOUNT: "1"
      RUBRIST_SQLITE_PATH: ${RUBRIST_SQLITE_PATH:-/var/lib/rubrist/rubrist.sqlite}
      BETTER_AUTH_SECRET: ${SERVICE_REALBASE64_64_AUTHSECRET}
      BETTER_AUTH_URL: ${SERVICE_URL_WEB}
      TRUSTED_ORIGINS: ${SERVICE_URL_WEB}
      RUBRIST_TRUST_PROXY: "1"
      RUBRIST_BOOTSTRAP_TOKEN: ${SERVICE_PASSWORD_64_BOOTSTRAP}
    stop_grace_period: 45s
    volumes:
      - rubrist_sqlite_data:/var/lib/rubrist
      - rubrist_sqlite_backups:/var/lib/rubrist-backups
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      start_period: 10m
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  rubrist_sqlite_data:
  rubrist_sqlite_backups:
