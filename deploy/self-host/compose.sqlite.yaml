# Single-host SQLite distribution. One API instance; durable local volume.
# PostgreSQL and trustctl retain their separate existing distribution.
services:
  web:
    image: ghcr.io/luka-zivkovic/rubrist-web:${RUBRIST_VERSION:?RUBRIST_VERSION is required}
    restart: unless-stopped
    ports:
      - "${RUBRIST_BIND_ADDRESS:-127.0.0.1}:${RUBRIST_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 18

  api:
    image: ghcr.io/luka-zivkovic/rubrist-api:${RUBRIST_VERSION:?RUBRIST_VERSION is required}
    restart: unless-stopped
    init: true
    environment:
      PORT: "8787"
      RUBRIST_STORAGE: sqlite
      RUBRIST_REQUIRE_PERSISTENT_MOUNT: "1"
      RUBRIST_SQLITE_PATH: ${RUBRIST_SQLITE_PATH:-/var/lib/rubrist/rubrist.sqlite}
      BETTER_AUTH_SECRET: ${RUBRIST_AUTH_SECRET:?RUBRIST_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${RUBRIST_PUBLIC_URL:-http://localhost:8081}
      TRUSTED_ORIGINS: ${RUBRIST_PUBLIC_URL:-http://localhost:8081}
      RUBRIST_TRUST_PROXY: "1"
      RUBRIST_BOOTSTRAP_TOKEN: ${RUBRIST_BOOTSTRAP_TOKEN:-}
    stop_grace_period: 45s
    volumes:
      - rubrist_sqlite_data:/var/lib/rubrist
      - rubrist_sqlite_backups:/var/lib/rubrist-backups
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      start_period: 10m
      interval: 10s
      timeout: 5s
      retries: 18

volumes:
  rubrist_sqlite_data:
  rubrist_sqlite_backups:
